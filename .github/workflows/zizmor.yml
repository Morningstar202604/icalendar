name: zizmor static analysis

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        run: pip install zizmor==1.29.0
      - name: Run zizmor
        run: zizmor --format sarif .github/workflows/ > zizmor-results.sarif
      - name: Upload SARIF file
        # Check against https://github.com/github/codeql-action/releases/
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          sarif_file: zizmor-results.sarif
